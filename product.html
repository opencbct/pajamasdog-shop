<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PajamasDog</title>
<link rel="icon" href="/favicon.ico?v=3" sizes="48x48">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=3">
<meta name="theme-color" content="#15131c">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shop.css?v=3">
<style>
.pic{border-radius:24px;overflow:hidden;position:relative;margin-top:4px}
.pic img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.pic .tag{position:absolute;top:14px;left:14px}
.pic .mine{position:absolute;top:14px;right:14px;left:auto;background:var(--pink);color:#fff}
.info{padding:18px 4px 8px}
.info h1{font-weight:300;font-size:28px;line-height:1.15}
.info p{opacity:.7;margin-top:6px}
.ship{font-size:13px;opacity:.6;margin:10px 0 18px}
.acts{display:grid;gap:10px}
@media(min-width:768px){main.two{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}.info{padding-top:8px}}
.price{font-size:26px;font-weight:300;margin:6px 0 10px}.price small{font-size:13px;opacity:.65;margin-left:6px}
.tag:has(img.plg){background:none!important;padding:0!important;box-shadow:none!important}
.tag img.plg{filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 3px rgba(255,255,255,.95)) drop-shadow(0 0 6px rgba(255,255,255,.7))}
.tag img.plg{height:26px!important;width:auto!important;max-width:none!important;aspect-ratio:auto!important;object-fit:contain!important;display:block;border-radius:0!important}
.sizes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.lbl2{font-size:12px;opacity:.6;margin:4px 0 6px}
.chip:disabled{opacity:.3;text-decoration:line-through}
.sf{border-radius:14px;background:var(--card);padding:10px 12px;margin:4px 0 12px;font-weight:300}
.sf summary{cursor:pointer;font-size:14px}
.sf-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 8px}
.sf-row label{font-size:11px;opacity:.75;display:grid;gap:3px}
.sf-row input{width:100%;padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:transparent;color:inherit;font:inherit;font-size:14px}
.sf-unit{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.sf-unit .btn{margin-left:auto;padding:8px 14px}
.sf-out{font-size:14px;margin:8px 0 2px}.sf-out small{opacity:.6;display:block}
.sf-help{font-size:11px;opacity:.55;margin:4px 0 0}
.bf{margin:2px 0 10px}.bf select{width:100%;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:var(--card);color:inherit;font:inherit;font-weight:300;font-size:15px;-webkit-appearance:none;appearance:none}
.bf-out{font-size:14px;margin:8px 0 0;font-weight:300}.bf-out small{opacity:.6;display:block}
.fits{border-radius:14px;background:var(--card);padding:10px 12px;margin:0 0 12px;font-weight:300}.fits .lbl2{margin-top:0}.fits small{opacity:.8}
.fz{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:13px;padding:5px 0;border-top:1px solid rgba(255,255,255,.07)}.fz b{font-weight:300;opacity:.95}.fz span{opacity:.75}
</style>
<link rel="stylesheet" href="logo-motion.css">
</head>
<body>
<header>
  <a href="/" aria-label="PajamasDog home"><img class="hlogo hv" src="img/logo2/classic.webp?v=2" alt="PajamasDog"></a>
  <a class="back" href="javascript:history.length>1?history.back():location.href='/'">← Back</a>
</header>
<main id="main" class="two"></main>
<footer><a href="/" class="flogo" aria-label="PajamasDog home"><img src="img/logo2/classic.webp?v=2" alt=""></a>Sold and shipped by PajamasDog. <a href="returns.html" style="text-decoration:underline">Shipping &amp; Returns</a> · <a href="privacy.html" style="text-decoration:underline">Privacy</a><br><small style="opacity:.6">As an Amazon Associate we earn from qualifying purchases. Some links to partner shops are affiliate links.</small></footer>
<script src="shop.js?v=7"></script>
<script src="sizes_data.js?v=2"></script>
<script src="sizes_extra.js?v=1"></script>
<script src="breeds.js?v=1"></script>
<script src="sizefinder.js?v=1"></script>
<script src="breedfit.js?v=1"></script>
<script src="gift.js?v=1"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const p = await getProduct(q.get('id'));
  const main = document.getElementById('main');
  if(!p){ main.innerHTML = '<div class="info"><h1>This item is not available here.</h1><p><a href="/">Back to the shop</a></p></div>'; return; }
  document.title = p.name + ' — PajamasDog';
  let tried = null; try { tried = sessionStorage.getItem('tryon:'+p.id); } catch(e){}
  const look = (q.get('look')||'').match(/^img\/p\/[\w-]+\.webp$/) ? q.get('look') : null;
  const pic = tried ? `<img src="${tried}" alt="Your pet in ${p.name}"><span class="tag mine">Your pet</span>`
            : look ? `<img src="${look}" alt="${p.name}"><span class="tag mine">Similar pick</span>` : visualOf(p);
  const ci0 = Math.max(0, Math.min((p.colors||[]).length-1, +(q.get('c')||0)));
  const shop = shopName(p);
  const live = p.src && p.src!=='sample';
  main.innerHTML = `
    <div class="pic">${pic}${(tried||look||p.src==='pd')?'':`<span class="tag">${shopBadge(p.src||"sample", p.id, p.badge)}</span>`}</div>
    <div class="info">
      <h1>${p.name}</h1>
      <p>${p.note||''}</p>
      ${p.src==='pd' ? `<div class="price"><span id="pr">${p.price_max>p.price?'<small style="margin:0 4px 0 0">from</small>':''}$${p.price.toFixed(2)}</span> <small>Free shipping · US 7–12 days · Canada 7–15 days</small></div>${p.pop>=100?`<p class="hot2">🔥 Carried by ${p.pop.toLocaleString('en-US')} pet shops worldwide</p>`:''}
      ${(p.colors||[]).length>1 ? `<div class="lbl2">Color</div><div class="sizes cols">${p.colors.map((c,i)=>`<button class="chip${i===ci0?' on':''}" data-c="${i}">${c}</button>`).join('')}</div>` : ''}
      ${(p.sizes||[]).length ? `<div class="lbl2">Size</div><div class="sizes szs"></div>${p.cat==='pajamas' ? breedFitHTML(p) + sizeFinderHTML() : ''}` : ''}` : ''}
      <div class="ship">${p.src==='pd' ? 'Sold by PajamasDog. All sales final — <a href="returns.html" style="text-decoration:underline">Shipping &amp; Returns</a>.' : live ? `Sold, shipped and returned by ${shop}.` : 'Coming soon.'}${p.look && !look && !tried ? ' Photo shows a similar style.' : ''}</div>
      <div class="acts">
        ${p.src==='pd' ? `<button class="btn" id="buy">${CHECKOUT_API ? 'Buy now' : 'Checkout opens soon'}</button>${CHECKOUT_API ? '<button class="btn ghost" id="gift">🎁 Send it as a gift</button>' : ''}`
          : live ? `<a class="btn" href="${linkOf(p)}" rel="sponsored noopener" target="_blank">See it on ${shop}</a>` : ''}
      </div>
    </div>`;
  // Item -> color -> size: sizes shown are the ones in stock for the chosen color.
  const colorIdx = () => +(main.querySelector('.cols .on')?.dataset.c || 0);
  let size = q.get('size') || '';
  const drawSizes = () => {
    const box = main.querySelector('.szs'); if(!box) return;
    const st = inStock(p, colorIdx());
    if(!st.includes(size)) size = '';
    box.innerHTML = (p.sizes||[]).map(z => `<button class="chip${z===size?' on':''}"${st.includes(z)?'':' disabled title="Sold out in this color"'} data-z="${z}">${z}</button>`).join('');
    const one = !(p.sizes||[]).length;
    PRICES.then(P => {
      const v = (one || size) ? priceSync(P, p, colorIdx(), size) : null, pr = main.querySelector('#pr');
      if(pr && v) pr.textContent = '$' + v.toFixed(2);
      else if(pr) pr.innerHTML = (p.price_max>p.price ? '<small style="margin:0 4px 0 0">from</small>' : '') + '$' + p.price.toFixed(2);
      main.querySelector('#buy') && (main.querySelector('#buy').textContent = !CHECKOUT_API ? 'Checkout opens soon' : one ? `Buy now · $${(v||p.price).toFixed(2)}` : size ? `Buy now · ${size} · $${(v||p.price).toFixed(2)}` : 'Pick a size');
    });
  };
  drawSizes();
  // 11-26: tapping a colour shows that colour's picture (from CJ variant photos, tools/cj_color_images.py).
  const CIMG = fetch('products/colorimgs.json?v=1').then(r => r.ok ? r.json() : {}).catch(() => ({}));
  const mainImg = main.querySelector('.pic img'), img0 = (tried || look) ? (p.img || mainImg?.getAttribute('src')) : mainImg?.getAttribute('src');
  // A "Similar pick" / try-on picture stays until the shopper taps a colour; then the real colour photo wins.
  let keepLook = !!(tried || look);
  const showColorPic = () => { if(keepLook || !mainImg) return;
    CIMG.then(M => { const src = (M[p.id] || [])[colorIdx()] || img0; if(mainImg.getAttribute('src') !== src) mainImg.src = src; }); };
  showColorPic();
  main.querySelector('.cols')?.addEventListener('click', e => { const b = e.target.closest('.chip'); if(!b) return;
    main.querySelectorAll('.cols .chip').forEach(c => c.classList.toggle('on', c===b)); drawSizes();
    if(keepLook){ keepLook = false; main.querySelector('.pic .tag.mine')?.remove(); }
    showColorPic(); });
  main.querySelector('.szs')?.addEventListener('click', e => { const b = e.target.closest('.chip'); if(!b || b.disabled) return; size = b.dataset.z; drawSizes(); });
  bindSizeFinder(main, () => p, colorIdx, z => { size = z; drawSizes(); });
  bindBreedFit(main, () => p, colorIdx, z => { size = z; drawSizes(); });
  main.querySelector('#buy')?.addEventListener('click', () => { if(!size && (p.sizes||[]).length){ main.querySelector('.sf')?.setAttribute('open',''); main.querySelector('.szs')?.scrollIntoView({block:'center', behavior:'smooth'}); return; } payDirect([{id:p.id, size, c:colorIdx()}]); });
  // 11-26: gift wrap = online unboxing (gift.js). Size first, then the gift sheet.
  main.querySelector('#gift')?.addEventListener('click', async () => {
    if(!size && (p.sizes||[]).length){ main.querySelector('.sf')?.setAttribute('open',''); main.querySelector('.szs')?.scrollIntoView({block:'center', behavior:'smooth'}); return; }
    const P = await PRICES, v = priceSync(P, p, colorIdx(), size) || p.price;
    GiftBuilder.open({photo: mainImg?.getAttribute('src') || p.img, total: v,
      onBuy: gift => payDirect([{id:p.id, size, c:colorIdx()}], 'none', gift)});
  });
})();
</script>
</body>
</html>
